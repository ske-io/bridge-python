[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ske-bridge"
version = "0.1.1"
description = "Runs any WSGI or ASGI application on SKE, with its background jobs, scheduled tasks, queued Celery tasks and beat schedule, and integrates with Django and Flask."
readme = "README.md"
license = "MIT"
authors = [{ name = "SKE" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Framework :: Django",
    "Framework :: Flask",
    "Framework :: Celery",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
ske-bridge = "ske_bridge.cli:main"

[project.urls]
Homepage = "https://ske.io"
Documentation = "https://app.ske.io/docs"
Repository = "https://github.com/ske-io/bridge-python"
Issues = "https://github.com/ske-io/bridge-python/issues"

[project.optional-dependencies]
django = ["django>=4.2"]
flask = ["flask>=3.0"]
celery = ["celery[sqs]>=5.3"]
jobs = ["boto3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "django>=4.2",
    "flask>=3.0",
    "celery[sqs]>=5.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ske_bridge"]
exclude = ["AGENTS.md", "CLAUDE.md"]

[tool.hatch.build.targets.sdist]
# Local working notes, never published.
exclude = ["/AGENTS.md", "/CLAUDE.md", "/.venv", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
